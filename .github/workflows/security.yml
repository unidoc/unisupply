name: Security

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - go.mod
      - go.sum

permissions: {}

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      stale: ${{ steps.staleness.outputs.stale }}
      govulncheck_rc: ${{ steps.govulncheck.outputs.govulncheck_rc }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build unisupply
        run: |
          set -euo pipefail
          go build -o /tmp/unisupply ./cmd/unisupply/ || { echo "::error::unisupply build failed"; exit 1; }

      - name: Install govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        id: govulncheck
        run: |
          set -euo pipefail
          GOVULNCHECK_RC=0
          govulncheck -format json ./... | tee /tmp/govulncheck.json || GOVULNCHECK_RC=$?
          if [ "$GOVULNCHECK_RC" -ne 0 ] && [ "$GOVULNCHECK_RC" -ne 3 ]; then
            echo "::error::govulncheck tool error (exit $GOVULNCHECK_RC)"
            exit "$GOVULNCHECK_RC"
          fi
          echo "govulncheck_rc=$GOVULNCHECK_RC" >> "$GITHUB_OUTPUT"

      - name: Install gosec
        run: |
          set -euo pipefail
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.1

      - name: Run gosec
        run: |
          set -euo pipefail
          gosec -no-fail -fmt sarif -out /tmp/gosec.sarif ./...

      - name: Run unisupply self-scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          /tmp/unisupply ./ --format json --github-token "$GITHUB_TOKEN" \
            > /tmp/unisupply.json
          /tmp/unisupply ./ --no-color --github-token "$GITHUB_TOKEN" \
            > /tmp/unisupply.txt

      - name: List stale direct dependencies
        run: |
          set -euo pipefail
          go list -e -m -json -u all | jq -r '
            select(.Indirect | not) |
            select(.Update != null) |
            .Path + " " + .Version + " → " + .Update.Version
          ' > /tmp/stale-deps.txt

      - name: Check 90-day staleness
        id: staleness
        run: |
          set -euo pipefail

          STALE_FLAG=false

          date_to_epoch() {
            local d="${1:0:10}"  # YYYY-MM-DD
            date -d "$d" +%s 2>/dev/null || date -j -f "%Y-%m-%d" "$d" +%s
          }

          : > /tmp/stale-90.txt

          while IFS=' ' read -r MODULE VERSION _; do
            [ -z "$MODULE" ] && continue
            INFO=$(curl -sf "https://proxy.golang.org/${MODULE}/@v/${VERSION}.info") || continue
            MOD_TIME=$(echo "$INFO" | jq -r '.Time // empty')
            [ -z "$MOD_TIME" ] && continue
            MOD_EPOCH=$(date_to_epoch "$MOD_TIME")
            NOW_EPOCH=$(date +%s)
            DAYS=$(( (NOW_EPOCH - MOD_EPOCH) / 86400 ))
            if [ "$DAYS" -gt 90 ]; then
              echo "STALE($DAYS days): $MODULE $VERSION" | tee -a /tmp/stale-90.txt
              STALE_FLAG=true
            fi
          done < /tmp/stale-deps.txt

          # Remove the file if no stale entries were recorded so upload-artifact's
          # if-no-files-found: warn behavior surfaces it as missing rather than empty.
          if [ ! -s /tmp/stale-90.txt ]; then
            rm -f /tmp/stale-90.txt
          fi

          echo "stale=$STALE_FLAG" >> "$GITHUB_OUTPUT"

      - name: Render supply-chain report to job summary
        if: always()
        env:
          GOVULNCHECK_RC: ${{ steps.govulncheck.outputs.govulncheck_rc }}
          STALE: ${{ steps.staleness.outputs.stale }}
        run: |
          set -euo pipefail

          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

          {
            echo "# Supply Chain Self-Scan — unisupply (dogfood)"
            echo
            echo "- **Run:** \`${GITHUB_WORKFLOW}\` #${GITHUB_RUN_NUMBER}"
            echo "- **Commit:** \`${GITHUB_SHA:0:12}\` (\`${GITHUB_REF_NAME}\`)"
            echo
            .github/scripts/render-scan-report.sh \
              /tmp/unisupply.json /tmp/stale-deps.txt /tmp/stale-90.txt
            echo
            echo "---"
            echo
            echo "_Full JSON, plain-text report, gosec SARIF, and govulncheck output are attached as workflow artifacts (\`scan-results\`)._"
          } >> "$SUMMARY"

      - name: Upload scan artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scan-results
          path: |
            /tmp/govulncheck.json
            /tmp/unisupply.json
            /tmp/unisupply.txt
            /tmp/gosec.sarif
            /tmp/stale-deps.txt
            /tmp/stale-90.txt
          retention-days: 30
          if-no-files-found: warn

      # Deliberately the last step in this job. It is a gate: a policy
      # violation must fail the workflow. Run earlier, its non-zero exit
      # skipped every step after it — the staleness listing, the artifact
      # upload, and with them the `report` job, which is `needs: audit`. A
      # failing policy gate is the strongest reason to file the weekly issue,
      # and instead it was the one condition that suppressed it: no issue has
      # been filed since 2026-W30. Collect and publish the evidence first,
      # then gate.
      - name: Run unisupply CI/CD scan (policy gate)
        run: |
          set -euo pipefail
          /tmp/unisupply ./ --scan-ci --no-color --policy .github/security-policy.json

  report:
    needs: audit
    # always(), so an audit failure still files the issue — that is when the
    # weekly report matters most. Skipped and cancelled runs produce no
    # evidence to report on, so they are excluded.
    if: >-
      always()
      && github.repository_owner == 'unidoc'
      && needs.audit.result != 'skipped'
      && needs.audit.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # The renderer lives in the repo, so this job needs a checkout — it had
      # none before, having only ever downloaded artifacts.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # continue-on-error: an audit that failed before the upload step leaves
      # no artifact. The issue is still worth filing — it reports the audit
      # failure itself — and the rendering steps below fall back when the
      # scan output is missing.
      - name: Download scan artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          name: scan-results
          path: .

      - name: File weekly security issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STALE: ${{ needs.audit.outputs.stale }}
          GOVULNCHECK_RC: ${{ needs.audit.outputs.govulncheck_rc }}
          EVENT_NAME: ${{ github.event_name }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          set -euo pipefail

          WEEK_KEY="[Security Scan] $(date -u +%Y-W%V)"

          EXISTING=$(gh issue list \
            --label security-scan \
            --state open \
            --json title \
            --jq "[.[] | select(.title == \"$WEEK_KEY\")] | length")
          if [ "$EXISTING" -gt 0 ]; then
            echo "Open issue for $WEEK_KEY already exists; skipping."
            exit 0
          fi

          # Only the level is read here — it is a FIRE condition. Everything
          # else the body reports is rendered by the shared script below.
          RISK_LEVEL="UNKNOWN"
          if [ -s ./unisupply.json ]; then
            RISK_LEVEL=$(jq -r '.overall_risk_level // "UNKNOWN"' ./unisupply.json)
          fi

          FIRE=false
          # A failed audit fires unconditionally: the policy gate tripped, or
          # the job broke before it could measure anything. Either way the
          # week needs a report, and the scan values below may be empty.
          if [ "${AUDIT_RESULT:-}" != "success" ]; then
            FIRE=true
          fi
          if [ "$GOVULNCHECK_RC" = "3" ]; then
            FIRE=true
          fi
          case "$RISK_LEVEL" in
            MEDIUM|HIGH|CRITICAL) FIRE=true ;;
          esac
          if [ "$STALE" = "true" ]; then
            FIRE=true
          fi

          if [ "$FIRE" != "true" ]; then
            echo "No gate condition met (audit=$AUDIT_RESULT govulncheck_rc=$GOVULNCHECK_RC risk_level=$RISK_LEVEL stale=$STALE); not filing issue."
            exit 0
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          RUN_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          AUDIT_NOTE=""
          if [ "${AUDIT_RESULT:-}" != "success" ]; then
            AUDIT_NOTE=" — the audit job did not succeed (policy gate tripped, or a step failed before it); values below may be incomplete"
          fi

          {
            echo "# Weekly Supply Chain Security Scan"
            echo
            echo "- **Run date:** ${RUN_DATE}"
            echo "- **Trigger:** ${EVENT_NAME}"
            echo "- **Workflow run:** ${RUN_URL}"
            echo "- **Audit job:** ${AUDIT_RESULT}${AUDIT_NOTE}"
            echo
            .github/scripts/render-scan-report.sh \
              ./unisupply.json ./stale-deps.txt ./stale-90.txt
            echo
            echo "---"
            echo
            echo "gosec findings are attached to the run as SARIF and visible under"
            echo "**Security → Code scanning**; the full JSON and plain-text reports are"
            echo "in the \`scan-results\` artifact."
            echo
            echo "## Closure guidance"
            echo
            echo "Close this issue **only after the underlying findings are actioned** (e.g."
            echo "dependency bumps merged, vulnerabilities resolved, annotations added). Closing"
            echo "the issue does not silence future scans — a fresh issue is filed each ISO week."
          } > ./issue-body.md

          # GitHub rejects an issue body over 65536 characters. Truncate with a
          # pointer to the run rather than letting the whole report fail to file.
          BODY_BYTES=$(wc -c < ./issue-body.md)
          if [ "$BODY_BYTES" -gt 60000 ]; then
            head -c 60000 ./issue-body.md > ./issue-body.trunc.md
            {
              echo
              echo "---"
              echo
              echo "_Report truncated at 60000 characters (${BODY_BYTES} rendered). Full output: ${RUN_URL}_"
            } >> ./issue-body.trunc.md
            mv ./issue-body.trunc.md ./issue-body.md
          fi

          gh label create security-scan \
            --color B60205 \
            --description "Weekly supply chain security scan findings" \
            --force >/dev/null

          gh issue create \
            --body-file ./issue-body.md \
            --label security-scan \
            --title "$WEEK_KEY"
