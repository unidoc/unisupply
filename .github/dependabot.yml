version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, go]

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
      minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, github-actions]
